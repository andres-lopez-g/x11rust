[package]
name = "x11-studio"
version = "1.0.0"
edition = "2024"
description = "A clearer, faster desktop control center for the X11 wireless mouse"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
hidapi = "2.6"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
